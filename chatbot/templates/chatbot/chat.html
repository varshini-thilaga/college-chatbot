<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SECE AI Assistant</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='10' fill='%230b3a6a'/><text y='.9em' font-size='70' x='10' fill='%23f4b400' font-weight='bold'>S</text></svg>">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{
    --primary:#0b3a6a;
    --accent:#f4b400;
    --bg:#f1f5f9;
    --surface:#ffffff;
    --border:#e5e7eb;
    --text:#111827;
    --muted:#6b7280;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
    font-family:Inter,sans-serif;
    background:var(--bg);
    color:var(--text);
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* HEADER */
header{
    background:var(--primary);
    color:#fff;
    padding:16px 28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.brand{
    display:flex;
    align-items:center;
    gap:14px;
}

.logo{
    width:40px;
    height:40px;
    border-radius:6px;
    background:var(--accent);
    color:#000;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
}

.brand h1{
    font-size:17px;
    font-weight:600;
}

.brand p{
    font-size:12px;
    opacity:.85;
}

.clear{
    background:#fff;
    color:var(--primary);
    border:none;
    padding:8px 16px;
    border-radius:6px;
    font-weight:600;
    cursor:pointer;
}

/* CONTAINER */
.container{
    flex:1;
    max-width:1050px;
    margin:20px auto;
    background:var(--surface);
    border-radius:12px;
    box-shadow:0 8px 24px rgba(0,0,0,.08);
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

/* CHAT */
.messages{
    flex:1;
    padding:26px;
    overflow-y:auto;
}

.message{
    display:flex;
    margin-bottom:16px;
}

.message.user{justify-content:flex-end}

.bubble{
    max-width:72%;
    padding:14px 18px;
    border-radius:10px;
    font-size:14.5px;
    line-height:1.6;
}

.user .bubble{
    background:var(--primary);
    color:#fff;
    border-bottom-right-radius:4px;
}

.bot .bubble{
    background:#f9fafb;
    border:1px solid var(--border);
    border-bottom-left-radius:4px;
}

.time{
    font-size:11px;
    color:var(--muted);
    margin-top:6px;
}

.audio-btn{
    margin-top:8px;
    background:#fff;
    border:1px solid var(--border);
    padding:4px 10px;
    border-radius:6px;
    font-size:12px;
    cursor:pointer;
}

/* INPUT */
.input-area{
    border-top:1px solid var(--border);
    padding:18px 24px;
    background:#fafafa;
}

.controls{
    display:flex;
    justify-content:flex-end;
    margin-bottom:10px;
}

select{
    padding:6px 10px;
    border:1px solid var(--border);
    border-radius:6px;
}

.form{
    display:flex;
    gap:10px;
}

input{
    flex:1;
    padding:14px 16px;
    border:1px solid var(--border);
    border-radius:8px;
    font-size:14px;
}

input:focus{
    outline:none;
    border-color:var(--primary);
}

.mic{
    width:44px;
    background:#e5e7eb;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.mic.active{
    background:#dc2626;
    color:#fff;
}

.send{
    background:var(--accent);
    border:none;
    padding:0 20px;
    border-radius:8px;
    font-weight:600;
    cursor:pointer;
}

/* MOBILE */
@media(max-width:768px){
    header{padding:14px}
    .container{margin:0;border-radius:0}
    .messages{padding:18px}
}
</style>
</head>

<body>

<header>
    <div class="brand">
        <div class="logo">SECE</div>
        <div>
            <h1>SECE AI Assistant</h1>
            <p>Sri Eshwar College of Engineering</p>
        </div>
    </div>
    <form method="post">
        {% csrf_token %}
        <button class="clear" name="clear_chat">New Chat</button>
    </form>
</header>

<div class="container">
    <div class="messages">
        {% for msg in chat_history %}
        <div class="message {{ msg.sender }}">
            <div class="bubble">
                {{ msg.text|linebreaks }}

                {% if msg.sender == "bot" and msg.audio_url %}
                <button class="audio-btn" onclick="playAudio(this)" data-src="{{ msg.audio_url }}">&#9654; Listen</button>
                {% endif %}

                <div class="time">{{ msg.time }}</div>
            </div>
        </div>
        {% endfor %}
    </div>

    <div class="input-area">
        <div class="controls">
            <label style="font-size:12px;color:var(--muted);margin-right:6px;">🎤 Voice Language:</label>
            <select id="languageSelect" onchange="updateLanguage()">
                <option value="en-US">English</option>
                <option value="ta-IN">Tamil</option>
                <option value="hi-IN">Hindi</option>
                <option value="te-IN">Telugu</option>
                <option value="kn-IN">Kannada</option>
                <option value="ml-IN">Malayalam</option>
            </select>
        </div>

        <form method="post" class="form">
            {% csrf_token %}
            <input type="hidden" name="language" id="languageInput" value="en-US">
            <input name="message" id="messageInput" placeholder="Ask about admissions, courses, fees, placements…" required>
            <button type="button" class="mic" id="micBtn">🎤</button>
            <button class="send">Send</button>
        </form>
    </div>
</div>

<script>
var _audioPlayer = new Audio();

function playAudio(btn){
    var src = btn.getAttribute('data-src');
    if(_audioPlayer.src.endsWith(src) && !_audioPlayer.paused){
        _audioPlayer.pause();
        btn.innerHTML = '&#9654; Listen';
        return;
    }
    document.querySelectorAll('.audio-btn').forEach(function(b){ b.innerHTML='&#9654; Listen'; });
    _audioPlayer.src = src;
    _audioPlayer.play();
    btn.innerHTML = '&#9646;&#9646; Pause';
    _audioPlayer.onended = function(){ btn.innerHTML='&#9654; Listen'; };
}

function updateLanguage(){
    document.getElementById("languageInput").value =
        document.getElementById("languageSelect").value;
}

let rec=null, recording=false;
document.getElementById("micBtn").onclick=()=>{
    if(!("webkitSpeechRecognition"in window)){
        alert("Voice input works only in Chrome");
        return;
    }
    if(!rec){
        rec=new webkitSpeechRecognition();
        rec.interimResults=false;
    }
    rec.lang=document.getElementById("languageSelect").value;
    if(recording){rec.stop();return;}
    recording=true;
    micBtn.classList.add("active");
    rec.start();
    rec.onresult=e=>{
        messageInput.value=e.results[0][0].transcript;
    };
    rec.onend=()=>{
        recording=false;
        micBtn.classList.remove("active");
    };
};
</script>

</body>
</html>
